<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wonder Files</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 48px auto; padding: 0 20px; color: #1b1b1b; line-height: 1.55; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .box { background: #f3f5f8; border-radius: 12px; padding: 16px; margin: 20px 0; word-break: break-all; }
  button { font-size: 16px; padding: 10px 18px; border: 0; border-radius: 8px; background: #111; color: #fff; cursor: pointer; }
  a { color: #0a58ca; }
</style>
</head>
<body>
<h1>Wonder Files</h1>
<p>True stories from nature, history and space, explained in under a minute.</p>

<div id="auth" hidden>
  <h2>TikTok connected</h2>
  <p>Copy this whole address and send it to your Telegram bot:</p>
  <div class="box" id="url"></div>
  <button onclick="navigator.clipboard.writeText(location.href); this.textContent='Copied';">Copy</button>
</div>

<p><a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms of Service</a></p>
<script>
  if (location.search.includes("code=") || location.search.includes("error=")) {
    document.getElementById("auth").hidden = false;
    document.getElementById("url").textContent = location.href;
  }
</script>
</body>
</html>
